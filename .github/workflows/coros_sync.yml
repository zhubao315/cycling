name: COROS Sync

# Daily sync from the official COROS MCP gateway, then rebuild and deploy the
# page. Data is committed back to main so history never depends on the
# Actions cache (the old cache-based workflow lost months of data when the
# Strava token expired).

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *' # 08:20 Asia/Shanghai
  push:
    branches:
      - main
    paths:
      - run_page/coros_mcp_sync.py
      - run_page/update_readme_stats.py
      - requirements.txt
      - src/**
      - assets/**
      - README.md
      - index.html
      - .github/workflows/coros_sync.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coros-sync
  cancel-in-progress: false

env:
  SKIP_GEOCODE: '1'
  SKIP_MERGE: '1'
  ATHLETE: zhubao315
  TITLE: "zhubao315的骑行生涯"
  TITLE_GRID: "Over 20km Rides"
  MIN_GRID_DISTANCE: 20

jobs:
  sync:
    name: Sync COROS data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync from COROS MCP
        run: |
          python run_page/coros_mcp_sync.py \
            --account "${{ secrets.COROS_ACCOUNT }}" \
            --password "${{ secrets.COROS_PASSWORD }}" \
            --max-downloads 45 --sport cycling --min-distance-km 3 --purge-fit
        # COROS allows 50 FIT downloads per day; stop at 45 and let the next
        # run pick up anything left over.

      # Imported (codoon) FIT data can carry GPS-glitch clusters kilometres
      # away from the real route; clean the allowlisted run ids on every sync
      # so the rebuild below never reintroduces them.
      - name: Filter GPS drift clusters
        run: |
          python run_page/fix_gps_drift.py \
            --json src/static/activities.json \
            --db run_page/data.db \
            --run-id 9223370427974524707

      - name: Regenerate SVG charts
        run: |
          python run_page/gen_svg.py --from-db --title "${{ env.TITLE }}" --type github --github-style "align-firstday" --athlete "${{ env.ATHLETE }}" --special-distance 10 --special-distance2 20 --special-color yellow --special-color2 red --output assets/github.svg --use-localtime --min-distance 3
          python run_page/gen_svg.py --from-db --title "${{ env.TITLE_GRID }}" --type grid --athlete "${{ env.ATHLETE }}" --output assets/grid.svg --special-color yellow --special-color2 red --special-distance 20 --special-distance2 50 --use-localtime --min-distance "${{ env.MIN_GRID_DISTANCE }}"
          python run_page/gen_svg.py --from-db --type circular --use-localtime
          python run_page/gen_svg.py --from-db --year $(date +"%Y") --language zh_CN --title "$(date +"%Y") 骑行" --type github --github-style "align-firstday" --athlete "${{ env.ATHLETE }}" --special-distance 10 --special-distance2 20 --special-color yellow --special-color2 red --output "assets/github_$(date +"%Y").svg" --use-localtime --min-distance 3

      - name: Regenerate per-year calendar SVGs
        run: |
          for y in $(python -c "import json;print(' '.join(sorted({a['start_date_local'][:4] for a in json.load(open('src/static/activities.json'))})))"); do
            python run_page/gen_svg.py --from-db --year "$y" --language zh_CN --title "$y 骑行" --type github --github-style "align-firstday" --athlete "${{ env.ATHLETE }}" --special-distance 20 --special-distance2 50 --special-color yellow --special-color2 red --output "assets/year_$y.svg" --use-localtime --min-distance 3
          done

      - name: Set up Node.js for 3D baking
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm for 3D baking
        run: npm install -g corepack@latest && corepack enable pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Bake 3D terrain for new activities
        run: node scripts/bake-scenes.mjs --since "$(date -u -d '7 days ago' +%F)" --limit 30 --min-distance 3000

      - name: Export parquet snapshot
        run: |
          pip install duckdb
          python run_page/save_to_parqent.py

      - name: Update README stats
        run: python run_page/update_readme_stats.py --sport cycling

      - name: Commit new runs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: sync runs $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

  deploy:
    name: Build and deploy page
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: npm install -g corepack@latest && corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: PATH_PREFIX=/${{ github.event.repository.name }} pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
